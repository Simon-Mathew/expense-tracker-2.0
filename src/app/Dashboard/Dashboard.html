<app-card
  variant="default-header"
  layout="row"
  title="Expense Tracker"
  className="Transaction"
>
  <div cardActions>
    <button class="btn">New Transaction</button>
  </div>
</app-card>

<div class="Dashboad">
  <div>
    <h1 class="Dashboad-heading">Dashboard</h1>
  </div>
  <div>
    <span class="badge">This month</span>
    <span class="badge">AUD</span>
  </div>
</div>
<app-divider type="minimal"></app-divider>

<app-card
  variant="income"
  layout="row"
  title="Income"
  className="Latest-Income"
  cardActions
>
  <div value>
    <h1>{{format(income)}}</h1>
  </div>
</app-card>

<app-card
  variant="expense"
  layout="row"
  title="Upcoming-Expense"
  className="Upcoming-Expense"
>
  <div value>
    <h1>{{format(expense)}}</h1>
  </div>
</app-card>

<app-card
  variant="current-balance"
  layout="row"
  title="Current-Balance"
  className="current-balance"
>
  <div value>
    <h1>{{format(balance)}}</h1>
  </div>
</app-card>

<app-card
  variant="transactions"
  layout="stack"
  title="Transactions-List"
  className="transactions"
></app-card>
