<div class="header">
  <div>
    <h1 class="Budgets-heading">Budgets</h1>
  </div>
  <div>
    <span class="badge">This Fortnight</span>
    <span class="badge">AUD</span>
  </div>
</div>

<!-- Rent card -->
<app-budgets-cards title="Rent" [value]="rentSpent" [limit]="450">
  <span value>$ {{rentSpent}}</span>
  <span limit>$450</span>
</app-budgets-cards>

<!-- Groceries card -->
<app-budgets-cards title="Groceries" [value]="groceriesSpent" [limit]="220">
  <span value>$ {{groceriesSpent}}</span>
  <span limit>$220</span>
</app-budgets-cards>

<!-- Dining Card -->
<app-budgets-cards title="Transport" [value]="transportSpent" [limit]="200">
  <span value>$ {{transportSpent}}</span>
  <span limit>$200</span>
</app-budgets-cards>

<app-budgets-cards title="Dining" [value]="diningSpent" [limit]="150">
  <span value>$ {{diningSpent}}</span>
  <span limit>$150</span>
</app-budgets-cards>
