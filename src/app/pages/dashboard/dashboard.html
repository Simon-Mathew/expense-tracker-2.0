<div class="container">
  <div class="Dashboard">
    <div>
      <h1 class="Dashboard-heading">Dashboard</h1>
    </div>
    <div cardActions>
      <app-button routerLink="/new-transaction-form">
        New Transaction
      </app-button>
    </div>
  </div>
  <app-divider type="minimal"></app-divider>

  <app-card
    variant="income"
    layout="row"
    title="Income"
    className="Latest-Income"
    cardActions
  >
    <div value>
      <h2>{{format(income)}}</h2>
    </div>
  </app-card>

  <app-card
    variant="expense"
    layout="row"
    title="Upcoming-Expense"
    className="Upcoming-Expense"
  >
    <div value>
      <h2>{{format(expense)}}</h2>
    </div>
  </app-card>

  <app-card
    variant="current-balance"
    layout="row"
    title="Current-Balance"
    className="current-balance"
  >
    <div value>
      <h2>{{format(balance )}}</h2>
    </div>
  </app-card>

  <app-card
    variant="transactions"
    layout="stack"
    title="Transactions-List"
    className="transactions"
  >
    <app-table />
  </app-card>
</div>
